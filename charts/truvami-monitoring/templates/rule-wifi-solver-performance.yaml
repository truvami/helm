apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
  name: truvami-wifi-solver-performance
spec:
  groups:
    - name: truvami-wifi-solver-performance
      rules:
        - alert: TruvamiWiFiSolverHighErrorRate
          annotations:
            description: >-
              **What's happening:** WiFi solver is experiencing high error rate (>5% over 5 minutes).

              **Why this occurred:** The `truvami_wifi_solver_error_count` / `truvami_wifi_solver_requests_count` ratio indicates
              the WiFi location solver is failing frequently. Common causes include:
              - WiFi access point database connectivity issues
              - Invalid or corrupted WiFi scan data from devices
              - WiFi solver service performance problems
              - Network connectivity issues to WiFi positioning services
              - Overloaded WiFi solver service

              **What to do:**
              1. Check WiFi solver service health and resource utilization
              2. Verify connectivity to WiFi positioning databases
              3. Review recent WiFi scan data quality
              4. Check solver service logs for specific error patterns
              5. Monitor solver service performance metrics
            summary: >-
              WiFi solver error rate high (>5% over 5min)
          expr: >-
            (
              rate(truvami_wifi_solver_error_count[5m]) /
              rate(truvami_wifi_solver_requests_count[5m])
            ) > 0.05
          for: 3m
          labels:
            namespace: {{ .Release.Namespace }}
            severity: major
            node: truvami-bridge
            service: truvami-bridge
            component: wifi-solver
            {{- with .Values.alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: TruvamiWiFiSolverLowSuccessRate
          annotations:
            description: >-
              **What's happening:** WiFi solver success rate has dropped below 90% over 5 minutes.

              **Why this occurred:** The ratio of successful WiFi location resolutions to total requests has declined.
              This may indicate degraded service quality even if not experiencing complete failures.

              **What to do:**
              1. Monitor WiFi solver performance trends
              2. Check for partial service degradation
              3. Review WiFi access point database quality
              4. Verify solver algorithm performance
            summary: >-
              WiFi solver success rate low (<90%)
          expr: >-
            (
              rate(truvami_wifi_solver_success_count[5m]) /
              rate(truvami_wifi_solver_requests_count[5m])
            ) < 0.90
          for: 5m
          labels:
            namespace: {{ .Release.Namespace }}
            severity: minor
            node: truvami-bridge
            service: truvami-bridge
            component: wifi-solver
            {{- with .Values.alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: TruvamiWiFiSolverZeroPositionHigh
          annotations:
            description: >-
              **What's happening:** WiFi solver is returning zero coordinates at high rate ({{ "{{" }} $value }} zero positions/sec).

              **Why this occurred:** The `truvami_wifi_zero_position_count` metric indicates the solver is frequently
              unable to determine valid coordinates from WiFi access point data. This suggests:
              - Poor WiFi access point coverage in device locations
              - Insufficient WiFi access points in scan data (accessPointCount={{ "{{" }} $labels.accessPointCount }})
              - WiFi access point database coverage gaps
              - Degraded positioning algorithm performance

              **What to do:**
              1. Analyze WiFi access point coverage in affected areas
              2. Review WiFi access point database completeness
              3. Check minimum access point count requirements
              4. Verify device WiFi scanning configuration
            summary: >-
              WiFi solver zero position rate high ({{ "{{" }} $labels.accessPointCount }} APs)
          expr: >-
            rate(truvami_wifi_zero_position_count[5m]) > 0.02
          for: 3m
          labels:
            namespace: {{ .Release.Namespace }}
            severity: warning
            node: truvami-bridge
            service: truvami-bridge
            component: wifi-solver
            {{- with .Values.alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: TruvamiTraxmateQuotaExhausted
          annotations:
            description: >-
              **What's happening:** Traxmate rejects WiFi solver requests with 401/403
              ({{ "{{" }} $value }} rejections in the last 5 minutes).

              **Why this occurred:** `truvami_traxmate_wifi_quota_exhausted_count` increases when Traxmate answers
              401 or 403. Traxmate documents 403 as "out of credits", but it answered 401 when the purchased requests
              ran out in the 2026-04-14 incident (truvami/bridge#219). It can also mean the service token was revoked
              or rotated. Every further request fails until this is fixed. Uplinks keep flowing: Google positions are
              still published and the Traxmate breaker stops the calls.

              **What to do:**
              1. Check the remaining request credits in the Traxmate portal and buy more if they are used up
              2. Verify the `<topic>-traxmate` secret (key `servicetoken`) matches the token in Traxmate
              3. Check bridge logs for "Traxmate WiFi solver quota exhausted or token rejected" and the `traxmateLogId`
              4. If it can't be fixed quickly, remove `traxmateWifiSolver` from the affected customers' feature flags
            summary: >-
              Traxmate WiFi solver out of credits or token rejected
          expr: >-
            increase(truvami_traxmate_wifi_quota_exhausted_count[5m]) > 0
          for: 0m
          labels:
            namespace: {{ .Release.Namespace }}
            severity: critical
            node: truvami-bridge
            service: truvami-bridge
            component: wifi-solver
            provider: traxmate
            {{- with .Values.alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        - alert: TruvamiWiFiSolverBreakerOpen
          annotations:
            description: >-
              **What's happening:** The circuit breaker for the {{ "{{" }} $labels.provider }} WiFi solver is open.

              **Why this occurred:** `truvami_wifi_solver_breaker_state` is 2 (open) after 5 consecutive failures
              (timeouts, 429/5xx, or 400/401/403). While open, the bridge skips this provider and probes it again
              every 30 seconds. Uplinks keep flowing; only positions from this provider are missing.

              **What to do:**
              1. Check the provider's status page and `truvami_wifi_solver_duration_seconds{provider="{{ "{{" }} $labels.provider }}"}`
              2. Review bridge logs for the provider's last errors (status codes, timeouts)
              3. For Traxmate, also check `TruvamiTraxmateQuotaExhausted`
              4. For Google (all customers), escalate: WiFi positions are missing for every customer
            summary: >-
              {{ "{{" }} $labels.provider }} WiFi solver circuit breaker open
          expr: >-
            max by (provider) (truvami_wifi_solver_breaker_state) == 2
          for: 2m
          labels:
            namespace: {{ .Release.Namespace }}
            severity: major
            node: truvami-bridge
            service: truvami-bridge
            component: wifi-solver
            {{- with .Values.alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
