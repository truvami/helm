apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "truvami-monitoring.fullname" . }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "truvami-monitoring.fullname" . }}"
rules:
- apiGroups: [""]
  resources:
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs: ["get", "list", "watch"]
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "truvami-monitoring.fullname" . }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "truvami-monitoring.fullname" . }}"
subjects:
- kind: ServiceAccount
  name: "{{ include "truvami-monitoring.fullname" . }}"
  namespace: {{ .Release.Namespace }}
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: "{{ include "truvami-monitoring.fullname" . }}"
spec:
  serviceAccountName: "{{ include "truvami-monitoring.fullname" . }}"
  replicas: 2
  podMonitorSelector: {}
  podMonitorNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name : {{ .Release.Namespace }}
  logFormat: "json"
  retention: {{ .Values.prometheus.retention | default "10d" }}
  {{- with .Values.prometheus.retentionSize }}
  retentionSize: {{ . | quote }}
  {{- end }}
  resources: {{ toYaml .Values.prometheus.resources | nindent 4 }}
  securityContext:
    fsGroup: 0
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
  storage:
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: {{ .Values.prometheus.storageSize | default "10Gi" }}
  ruleSelector: {}
  ruleNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  scrapeConfigSelector: {}
  scrapeConfigNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  serviceMonitorSelector: {}
  serviceMonitorNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  {{- if .Values.alertmanager.enabled }}
  alerting:
    alertmanagers:
    # Addresses the Service created by templates/alertmanager-service.yaml.
    # Only emitted when the Alertmanager is enabled - pointing Prometheus at a
    # Service that is not rendered leaves it with zero activeAlertmanagers and
    # silently discards every firing alert.
    - namespace: {{ .Release.Namespace }}
      name: "{{ include "truvami-monitoring.fullname" . }}"
      port: {{ .Values.alertmanager.portName | default "web" }}
  {{- end }}
  enableRemoteWriteReceiver: {{ .Values.prometheus.enableRemoteWriteReceiver | default "false" }}
  {{- if .Values.thanos.enabled }}
  thanos:
    image: "{{ .Values.thanos.image.repository }}:{{ .Values.thanos.image.tag }}"
    objectStorageConfig:
      name: {{ include "truvami-monitoring.thanos.objstoreSecretName" . }}
      key: {{ include "truvami-monitoring.thanos.objstoreSecretKey" . }}
    {{- with .Values.thanos.sidecar.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.thanos.sidecar.additionalArgs }}
    additionalArgs:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

{{- if .Values.alertmanager.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: "{{ include "truvami-monitoring.fullname" . }}"
  labels:
    {{- include "truvami-monitoring.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.alertmanager.replicas | default 2 }}
  portName: {{ .Values.alertmanager.portName | default "web" }}
  {{- with .Values.alertmanager.retention }}
  retention: {{ . | quote }}
  {{- end }}
  # Use the AlertmanagerConfig rendered by templates/alertmanager-config.yaml as
  # this Alertmanager's top-level configuration.
  #
  # This replaces the previous `configSecret` reference, which named a Secret
  # ("<fullname>-alertmanager-config") that no template in this chart has ever
  # created. With that Secret absent, prometheus-operator fell back to its
  # built-in default configuration, whose root route sends everything to the
  # "null" receiver - so alerts were accepted and then discarded.
  alertmanagerConfiguration:
    name: {{ include "truvami-monitoring.fullname" . }}-config
  # Additionally select any AlertmanagerConfig in this namespace that opts in,
  # so teams can attach extra routes/receivers without editing this chart.
  # Previously unset, which meant zero AlertmanagerConfigs were ever selected.
  alertmanagerConfigSelector:
    matchLabels:
      {{- toYaml (.Values.alertmanager.configSelectorLabels | default (dict "truvami.com/alertmanager-config" "true")) | nindent 6 }}
  resources: {{ toYaml .Values.alertmanager.resources | default "{}" | nindent 4 }}
{{- end }}
