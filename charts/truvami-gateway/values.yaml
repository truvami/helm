# Default values for truvami-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

gateway:
  # Strimzi cluster name for Kafka resources
  cluster: "truvami-stack"

  topic: truvami
  otel:
    enable: true
    endpoint: "localhost:4318"

  # Locksmith integration. This block is rendered into
  # /etc/truvami-gateway/config.yaml. To enable JWKS-based auth set
  # jwks.enabled (top-level) to mount the JWKS secret AND populate
  # locksmith.endpoint and locksmith.jwt.audience. locksmith.jwks.location
  # is auto-derived from jwks.mountPath + jwks.secretKey when jwks.enabled
  # is true and location is left empty; set it explicitly only if the JWKS
  # file lives outside the chart-managed mount.
  locksmith:
    endpoint: ""
    jwks:
      location: ""
      reloadInterval: 5s
      refreshInterval: 1m
      requestTimeout: 2s
    jwt:
      audience: "gateway"

  kafka:
    bootstrap:
      servers:
        - truvami-stack-kafka-bootstrap:9093
    allow.auto.create.topics: false
    enable.ssl.certificate.verification: false
    ssl:
      ca:
        location: /var/run/secrets/kafka/ca.crt
    security:
      protocol: SSL

  # LTE Cat 1 downlinks. When enabled, Cat 1 uplink responses carry the device's downlinks
  # that Pulse queued on the kafka.topic.cat1Downlinks topic. A read that fails or exceeds
  # scanTimeout answers 204, so uplinks are never held up. groupId is also the consumer
  # group the chart's KafkaUser may use.
  cat1:
    downlinks:
      enabled: false
      scanTimeout: 2s
      maxRows: 16
      groupId: gateway-cat1-downlinks
      consumers: 4

# APIKEYS_LEGACY_LABELS env var (parallel string array to APIKEYS; the
# gateway uses these to label JWT claims minted from legacy API keys).
# Sourced from the same secret as apikeys by default. Always injected
# with optional=true — leave the secret key absent if you don't need it.
apiKeysLegacyLabels:
  secretName: ""
  secretKey: "legacyLabels"

kafka:
  topic:
    unauthorized: gateway.unauthorized
    cat1: gateway.cat1.uplinks
    cat1Error: gateway.cat1.errors
    # LTE Cat 1 downlink topic shared with Pulse (keyed by DevEUI). Must match
    # gateway.kafka.topics.cat1Downlinks and Pulse's kafka.topics.cat1Downlinks when either
    # is overridden. Retention must cover the longest campaign downlink validity, and the
    # partition count must not change once in use (it moves devices to other partitions).
    cat1Downlinks: gateway.cat1.downlinks
    partitions: 3
    replicas: 3
    config:
      retention.ms: 2592000000
      segment.bytes: 1073741824

# JWKS public secret mount (chart-only; not rendered into config.yaml).
# When enabled, the locksmith-managed JWKS public key set is mounted at
# {mountPath}/{secretKey}. To make the gateway actually validate JWTs, also
# set gateway.locksmith.endpoint, gateway.locksmith.jwks.location and
# gateway.locksmith.jwt.audience.
jwks:
  enabled: false
  secretName: "locksmith-jwks-public"
  secretKey: "jwks.json"
  mountPath: "/var/run/secrets/gateway"

replicaCount: 1

image:
  repository: ghcr.io/truvami/gateway
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: metrics
readinessProbe:
  httpGet:
    path: /
    port: metrics

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes:
  - configMap:
      defaultMode: 420
      name: "truvami-gateway-config"
      optional: false
    name: config
  - name: kafka-credentials
    secret:
      defaultMode: 420
      optional: false
      secretName: "truvami-gateway-kafka"

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /etc/truvami-gateway
    name: config
    readOnly: true
  - mountPath: /var/run/secrets/kafka
    mountPropagation: None
    name: kafka-credentials
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

serviceMonitor:
  enabled: true

pdb:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1
