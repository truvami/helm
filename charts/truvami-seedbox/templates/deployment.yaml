{{- $mapsCustomerUUID := "" -}}
{{- $mapsMountRoot := "" -}}
{{- $seedboxMaps := .Values.seedbox.producer.maps | default dict -}}
{{- range $key := list "enabled" "customerUUID" "data" "files" -}}
{{- if hasKey $seedboxMaps $key -}}
{{- fail (printf "seedbox.producer.maps.%s is not supported; move deployment map settings to top-level maps" $key) -}}
{{- end -}}
{{- end -}}
{{- if .Values.maps.enabled -}}
{{- $mapsCustomerUUID = required "maps.customerUUID is required when maps.enabled" .Values.maps.customerUUID -}}
{{- if not (regexMatch "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $mapsCustomerUUID) -}}
{{- fail "maps.customerUUID must be a canonical UUID" -}}
{{- end -}}
{{- $mapsMountRoot = clean (required "maps.mountPath is required when maps.enabled" .Values.maps.mountPath) -}}
{{- $mapsReadRoot := clean (required "seedbox.producer.maps.path is required when maps.enabled" $seedboxMaps.path) -}}
{{- if ne $mapsMountRoot $mapsReadRoot -}}
{{- fail (printf "maps.mountPath (%s) must match seedbox.producer.maps.path (%s)" $mapsMountRoot $mapsReadRoot) -}}
{{- end -}}
{{- end -}}
{{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) -}}
{{- if and .Values.maps.enabled (not .Values.maps.existingConfigMap) -}}
{{- $_ := set $podAnnotations "checksum/maps" (include (print $.Template.BasePath "/maps-configmap.yaml") $ | sha256sum) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "truvami-seedbox.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "truvami-seedbox.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "truvami-seedbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "truvami-seedbox.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "truvami-seedbox.serviceAccountName" . }}
      {{- $defaultPodSecCtx := dict "runAsNonRoot" true "fsGroup" 1000 }}
      {{- $podSecCtx := mustMergeOverwrite $defaultPodSecCtx (.Values.podSecurityContext | default dict) }}
      securityContext:
        {{- toYaml $podSecCtx | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          args:
            - '--config'
            - /etc/truvami-seedbox/seedbox.yaml
          command:
            - /usr/bin/truvami-seedbox
          env:
            {{- if .Values.seedbox.valkey.enabled }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.valkey.secretKey }}
                  name: {{ required "valkey.secretName is required when seedbox.valkey.enabled" .Values.valkey.secretName }}
                  optional: false
            {{- end }}
          {{- $defaultSecCtx := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "runAsNonRoot" true "runAsUser" 1000 "runAsGroup" 1000 "capabilities" (dict "drop" (list "ALL")) "seccompProfile" (dict "type" "RuntimeDefault") }}
          {{- $secCtx := mustMergeOverwrite $defaultSecCtx (.Values.securityContext | default dict) }}
          securityContext:
            {{- toYaml $secCtx | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.seedbox.metrics.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /etc/truvami-seedbox
              name: config
              readOnly: true
            {{- if .Values.maps.enabled }}
            - name: maps
              mountPath: {{ printf "%s/%s" (trimSuffix "/" $mapsMountRoot) $mapsCustomerUUID | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - configMap:
            defaultMode: 420
            name: {{ include "truvami-seedbox.fullname" . }}-config
            optional: false
          name: config
        {{- if .Values.maps.enabled }}
        - name: maps
          configMap:
            name: {{ include "truvami-seedbox.mapsConfigMapName" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
