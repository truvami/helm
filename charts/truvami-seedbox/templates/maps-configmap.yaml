{{- if and .Values.maps.enabled (not .Values.maps.existingConfigMap) }}
{{- $_ := required "maps.customerUUID is required when maps.enabled" .Values.maps.customerUUID }}
{{- if not .Values.maps.data }}
{{- fail "maps.data is required for chart-managed maps; otherwise set maps.existingConfigMap" }}
{{- end }}
{{- if not (hasKey .Values.maps.data "preset.yaml") }}
{{- fail "maps.data must contain preset.yaml" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "truvami-seedbox.mapsConfigMapName" . }}
  labels:
    {{- include "truvami-seedbox.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.maps.data }}
  {{ $key }}: |
    {{- $val | nindent 4 }}
  {{- end }}
{{- end }}
