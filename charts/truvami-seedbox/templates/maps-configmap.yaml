{{- if and (eq (include "truvami-seedbox.mapsEnabled" .) "true") (not .Values.maps.existingConfigMap) }}
{{- $customerUUID := include "truvami-seedbox.mapsCustomerUUID" . }}
{{- $nested := .Values.seedbox.producer.maps | default dict }}
{{- $mapsData := .Values.maps.data }}
{{- if $nested.files }}
{{- $mapsData = $nested.files }}
{{- else if $nested.data }}
{{- $mapsData = $nested.data }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "truvami-seedbox.mapsConfigMapName" . }}
  labels:
    {{- include "truvami-seedbox.labels" . | nindent 4 }}
data:
  {{- if $mapsData }}
  {{- range $key, $val := $mapsData }}
  {{ $key }}: |
    {{- $val | nindent 4 }}
  {{- end }}
  {{- else }}
  {{- range $path, $_ := .Files.Glob (printf "demo-maps/%s/*" $customerUUID) }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
