# Default values for truvami-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

api:
  server:
    port: 8888
    cors:
      allowedOrigins:
        - http://localhost:3000
        - http://api.truvami.com
        - http://api.test.truvami.com

  metrics:
    enabled: true
    port: 8889

  auth:
    jwksURL: "https://sso.sbcdc.ch/auth/realms/truvami/protocol/openid-connect/certs"
    issuer: "https://sso.sbcdc.ch/auth/realms/truvami"

  grpc:
    host: "0.0.0.0"
    port: 5001

  otel:
    enabled: false
    endpoint: "localhost:4318"

  webhook:
    initializationTimeout: 15s
    postRequestTimeout: 5s
    response:
      storedMaxBodySize: 512
  database:
    initializationTimeout: 15s
    migrateTimeout: 1m
    # Connection pool sizing for the transaction-mode PgBouncer pooler.
    # Keep (replicaCount * connectionMaxOpen) below the pooler's max_client_conn.
    connectionMaxOpen: 40
    connectionMaxIdle: 40
    # Server-side prepared statement cache; must stay <= the pooler's
    # max_prepared_statements to remain safe under transaction pooling.
    statementCacheCapacity: 200
    # Best-effort, non-fatal startup check against the PgBouncer admin console.
    verifyPoolerConfig: true

  # This should be set using environment variables
  # encryption:
  #   key: "truvami"

  thingpark:
    host: "proxy1.lpn.swisscom.ch"
    asId: "TWA_xxxxxxxxx.xxxxx.AS"
    # asSecret: "xxxxxxxxxxxxxx"

  valkey:
    host: truvami-stack-valkey-primary:6379
    username: default
    configDispatch:
      keyPrefix: "config_dispatch"
      defaultTimeout: 60s

database:
  # Use pooler for connection by default
  host: "truvami-stack-pooler"
  # Direct read-write service (bypasses the pooler), used by the migrate job.
  # DDL such as `ALTER TYPE ... ADD VALUE` and goose NO TRANSACTION migrations
  # are unsafe through a transaction-mode pooler. Falls back to `host` if unset.
  directHost: "truvami-stack-rw"
  port: 5432
  name: "app"
  # Fallback to secret-based configuration for backwards compatibility
  secretName: truvami-stack-app
  secretKey: uri

valkey:
  secretName: truvami-stack-valkey
  secretKey: valkey-password

replicaCount: 1

image:
  repository: ghcr.io/truvami/api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534

metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    additionalLabels: {}

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - configMap:
      defaultMode: 420
      name: "config-api"
      optional: false
    name: config

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /etc/truvami-api
    name: config
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

migration:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 512Mi
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534

serviceMonitor:
  enabled: false

networkPolicy:
  enabled: false

pdb:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1
