{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "truvami-pulse.fullname" . }}
  labels:
    {{- include "truvami-pulse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "truvami-pulse.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: {{ include "truvami-pulse.grpcPort" . }}
        - protocol: TCP
          port: {{ .Values.pulse.metrics.port }}
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS outbound (ThingPark AS-to-LRC downlinks)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Allow HTTP outbound
    - to: []
      ports:
        - protocol: TCP
          port: 80
    {{- $apiAddress := trim (default "" .Values.pulse.grpc.api.address) }}
    {{- if $apiAddress }}
    # Allow the truvami-api execution-store gRPC endpoint
    - to:
        {{- toYaml (.Values.networkPolicy.apiPeers | default list) | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "truvami-pulse.portFromAddress" (dict "key" "pulse.grpc.api.address" "address" $apiAddress) }}
    {{- end }}
    {{- $locksmithAddress := trim (default "" .Values.pulse.grpc.locksmith.address) }}
    {{- if $locksmithAddress }}
    # Allow the truvami-locksmith credential-resolution gRPC endpoint
    - to:
        {{- toYaml (.Values.networkPolicy.locksmithPeers | default list) | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "truvami-pulse.portFromAddress" (dict "key" "pulse.grpc.locksmith.address" "address" $locksmithAddress) }}
    {{- end }}
    # Allow OTLP HTTP trace export
    - to: []
      ports:
        - protocol: TCP
          port: 4318
{{- end }}
